version: 2.1
orbs:
  browser-tools: circleci/browser-tools@2.4.2
jobs:
  cljs:
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    docker:
      - image: cimg/clojure:1.12-openjdk-21.0-browsers
    steps:
      - browser-tools/install_browser_tools:
          install_firefox: false
          install_geckodriver: false
      - checkout
      - run: node --version
      - run: sudo corepack enable pnpm || sudo npm i -g pnpm@11.21.0
      - restore_cache:
          key: cljs-{{ checksum "deps.edn" }}-{{ checksum "pnpm-lock.yaml" }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec shadow-cljs -A:dev -v compile ci-tests
      - run: ls -l target
      - run: pnpm exec karma start --single-run
      - save_cache:
                paths:
                  - ~/.local/share/pnpm/store
                  - ~/.m2
                key: cljs-{{ checksum "deps.edn" }}-{{ checksum "pnpm-lock.yaml" }}
  clj:
    docker:
      - image: cimg/clojure:1.12-openjdk-21.0
    steps:
      - checkout
      - restore_cache:
          key: clj-{{ checksum "deps.edn" }}
      - run: clojure -A:dev:test:clj-tests -J-Dguardrails.enabled=true -J-Dguardrails.config=guardrails-test.edn
      - save_cache:
          paths:
            - ~/.m2
          key: clj-{{ checksum "deps.edn" }}
workflows:
  version: 2
  fullstack:
    jobs:
      - clj
      - cljs
